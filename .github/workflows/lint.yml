name: "Lint"

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with: 
        python-version: '3.10'
        cache: 'pip'
    - run: python -m pip install -Ur requirements.txt
    - name: Lint
      run: ruff check
    - name: Format
      run: ruff format --check
