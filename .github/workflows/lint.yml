name: "Lint"

on: [push, pull_request]

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
      with: 
        python-version: '3.10'
        cache: 'pip'
    - run: pip install -Ur requirements.txt
    - run: black --check .

  flake8:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-python@v2
      with: 
        python-version: '3.10'
        cache: 'pip'
    - run: pip install -Ur requirements.txt
    - run: flake8